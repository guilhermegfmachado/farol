name: Deploy to GitHub Pages

# Two-stage by necessity: this builds the site and pushes it to the gh-pages
# branch, and GitHub's own "pages build and deployment" workflow then publishes
# that branch. Both stages need a runner, which is a real weakness — on
# 2026-08-06 GitHub could not allocate runners for hours and the site sat on an
# old build even though the build itself had succeeded.
#
# The one-job alternative (upload-pages-artifact + deploy-pages) was tried and
# rejected by GitHub in two seconds, with no logs and no runner: the
# github-pages environment still restricts deployments to the gh-pages branch,
# so a deploy from main is refused before the job starts. Adopting it needs two
# things changed in repository settings first, neither of which a workflow can
# do for itself once Pages is already configured this way:
#
#   1. Settings → Pages → Source: "GitHub Actions"
#   2. Settings → Environments → github-pages → allow deployments from main
#
# Until then this is the version that works.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Queue deploys rather than let two publish at once; never cancel, so a merge
# landing during a deploy still goes live.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
