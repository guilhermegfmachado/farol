<!doctype html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sem ligação — Farol</title>
  <link rel="icon" type="image/svg+xml" href="/farol/favicon.svg" />
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #fafafa; color: #14171a;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      padding: 2rem; text-align: center; line-height: 1.6;
    }
    @media (prefers-color-scheme: dark) { body { background: #131722; color: #ece7dc; } }
    main { max-width: 32rem; }
    .mark { width: 56px; height: 56px; margin: 0 auto 1.5rem; display: block; }
    h1 { font-size: 1.3rem; margin: 0 0 0.5rem; }
    p { color: #4a5159; margin: 0 0 1.5rem; }
    @media (prefers-color-scheme: dark) { p { color: #b5aea0; } }
    button {
      font: inherit; font-size: 0.9rem; cursor: pointer;
      background: #2a4a5e; color: #fff; border: none; border-radius: 3px; padding: 0.6rem 1.4rem;
    }
    button:hover { background: #3a5d73; }
    .note { font-size: 0.8rem; margin-top: 1.25rem; }
  </style>
</head>
<body>
  <main>
    <svg class="mark" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <g transform="translate(3 3)">
        <path d="M10.3 6.2 L13 3.3 L15.7 6.2 Z" fill="currentColor"/>
        <rect x="10.9" y="6.2" width="4.2" height="3.5" fill="currentColor"/>
        <rect x="8.7" y="9.7" width="8.6" height="1.4" fill="currentColor"/>
        <path d="M10.4 11.1 L15.6 11.1 L15.95 13.0 L10.05 13.0 Z" fill="currentColor"/>
        <path d="M9.87 13.9 L16.13 13.9 L16.45 16.6 L9.55 16.6 Z" fill="currentColor"/>
        <path d="M9.35 17.5 L16.65 17.5 L17.5 21.3 L8.5 21.3 Z" fill="currentColor"/>
        <rect x="7.1" y="21.3" width="11.8" height="2" fill="currentColor"/>
        <circle cx="13" cy="7.9" r="1.45" fill="#e8a93d"/>
      </g>
    </svg>
    <h1>Sem ligação à internet</h1>
    <p>Esta página ainda não foi guardada para uso offline. As páginas que já visitou continuam disponíveis sem ligação.</p>
    <button onclick="location.reload()">Tentar novamente</button>
    <p class="note"><a href="/farol/" style="color:inherit;">← Voltar ao início</a></p>
  </main>
</body>
</html>
